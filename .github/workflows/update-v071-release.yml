name: Update v0.7.1 release notes

on:
  push:
    branches:
      - claude/eager-archimedes-NO2px

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update v0.7.1 release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v0.7.1 \
            --repo LyannEpitech/boldlabels \
            --notes "## ✨ Nouveautés
          - onboarding tutorial — 14-step spotlight walkthrough (FR+EN), auto-pause on screen change, resumable / skippable (#92)
          - save progress bar on the Save button — animated green fill during auto-save (#92)
          - Settings modal (⚙️ avatar menu) — dark mode, language, tutorial reset, data clear (#92)

          ## 🐛 Corrections
          - generate layout settings not restored on template load (\`template.id\` undefined on mount) (#92) (#93)"
