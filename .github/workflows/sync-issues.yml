name: Sync accepted issues

on:
  issues:
    types: [labeled]

jobs:
  sync:
    if: github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on BoldLabels_local
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          printf '%s\n\n> Sync depuis [boldlabels#%s](%s)' "$ISSUE_BODY" "$ISSUE_NUMBER" "$ISSUE_URL" > /tmp/body.txt
          gh issue create \
            --repo LyannEpitech/BoldLabels_local \
            --title "$ISSUE_TITLE" \
            --body-file /tmp/body.txt
