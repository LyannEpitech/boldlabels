name: Update v0.9.0 release notes
on:
  push:
    branches:
      - claude/eager-archimedes-LLg7U
    paths:
      - .github/workflows/update-v090-release.yml

jobs:
  update-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Write notes file
        run: |
          printf '%s\n' "## ✨ Nouveautés" > /tmp/notes.md
          printf '%s\n' "- **Système de crédits, streak et parrainage** : les utilisateurs accumulent des crédits à chaque session, maintiennent une série active (streak) et peuvent inviter d'autres personnes via un lien de parrainage appliqué automatiquement." >> /tmp/notes.md
          printf '%s\n' "- **Suivi analytique complet** : toutes les actions utilisateur sont instrumentées, notamment l'ouverture du panneau crédits (\`credits.panel_open\`) et l'application automatique d'un code de parrainage (\`referral.auto_applied\`)." >> /tmp/notes.md
      - name: Update release
        run: gh release edit v0.9.0 --repo LyannEpitech/boldlabels --notes-file /tmp/notes.md
