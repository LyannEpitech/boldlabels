name: Update v0.9.0 release notes
on:
  push:
    branches:
      - claude/eager-archimedes-LLg7U
    paths:
      - .github/workflows/update-v090-release.yml

jobs:
  update-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update v0.9.0 release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v0.9.0 \
            --repo LyannEpitech/boldlabels \
            --notes "## ✨ Nouveautés
- **Système de crédits, streak et parrainage** : les utilisateurs accumulent des crédits à chaque session, maintiennent une série active (streak) et peuvent inviter d'autres personnes via un lien de parrainage appliqué automatiquement.
- **Suivi analytique complet** : toutes les actions utilisateur sont instrumentées, notamment l'ouverture du panneau crédits (\`credits.panel_open\`) et l'application automatique d'un code de parrainage (\`referral.auto_applied\`)."
